services:
  postgres:
    image: postgres:16-alpine
    container_name: cms-strapi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    # Host port 5433 — 5432 dipakai container lain (course-platform-db)
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - cms_strapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-strapi}"]
      interval: 5s
      timeout: 5s
      retries: 12

  strapi:
    # Opsional: full Docker (docker compose --profile full up -d)
    # Default dev flow: cuma postgres di Docker, Strapi via `npm run develop`
    profiles: ["full"]
    build: .
    container_name: cms-strapi-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
    ports:
      - "1337:1337"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cms_strapi_pgdata:
